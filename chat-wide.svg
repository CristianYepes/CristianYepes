<svg xmlns="http://www.w3.org/2000/svg" width="648" height="534" viewBox="0 0 648 534">
<style>
text{font:20px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
.bubble{fill:#30363d}
.dot{fill:#8b949e;animation:blink .9s infinite}
.hide{opacity:0}
g{transform-box:fill-box;transform-origin:0 50%}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:none}}
@keyframes typing{0%{opacity:0}15%,85%{opacity:1}100%{opacity:0}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
#t0{animation:typing 1.0s ease 0.60s 1 both}
#m0{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) 1.60s 1 both}
#t1{animation:typing 1.0s ease 2.80s 1 both}
#m1{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) 3.80s 1 both}
#t2{animation:typing 1.0s ease 5.00s 1 both}
#m2{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) 6.00s 1 both}
#t3{animation:typing 1.0s ease 7.20s 1 both}
#m3{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) 8.20s 1 both}
#t4{animation:typing 1.0s ease 9.40s 1 both}
#m4{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) 10.40s 1 both}
#t5{animation:typing 1.0s ease 11.60s 1 both}
#m5{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) 12.60s 1 both}
#t6{animation:typing 1.0s ease 13.80s 1 both}
#m6{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) 14.80s 1 both}
</style>
<rect width="100%" height="100%" rx="12" fill="#0d1117" stroke="#30363d"/>
<g id="t0" class="hide"><rect x="28" y="28" width="72" height="50" rx="25" class="bubble"/><circle cx="50" cy="53" r="4" class="dot" style="animation-delay:0.00s"/><circle cx="64" cy="53" r="4" class="dot" style="animation-delay:0.15s"/><circle cx="78" cy="53" r="4" class="dot" style="animation-delay:0.30s"/></g>
<g id="m0" class="hide"><rect x="28" y="28" width="183" height="54" rx="20" class="bubble"/><text x="46" y="61">Hi, I'm Cristian</text></g>
<g id="t1" class="hide"><rect x="28" y="94" width="72" height="50" rx="25" class="bubble"/><circle cx="50" cy="119" r="4" class="dot" style="animation-delay:0.00s"/><circle cx="64" cy="119" r="4" class="dot" style="animation-delay:0.15s"/><circle cx="78" cy="119" r="4" class="dot" style="animation-delay:0.30s"/></g>
<g id="m1" class="hide"><rect x="28" y="94" width="504" height="54" rx="20" class="bubble"/><text x="46" y="127">Industrial Data &amp; AI Engineer at Renault Group</text></g>
<g id="t2" class="hide"><rect x="28" y="160" width="72" height="50" rx="25" class="bubble"/><circle cx="50" cy="185" r="4" class="dot" style="animation-delay:0.00s"/><circle cx="64" cy="185" r="4" class="dot" style="animation-delay:0.15s"/><circle cx="78" cy="185" r="4" class="dot" style="animation-delay:0.30s"/></g>
<g id="m2" class="hide"><rect x="28" y="160" width="512" height="82" rx="20" class="bubble"/><text x="46" y="193">I work with sensor data from production robots,</text><text x="46" y="221">catching issues before they hit the line</text></g>
