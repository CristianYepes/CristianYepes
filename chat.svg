<svg xmlns="http://www.w3.org/2000/svg" width="400" height="588" viewBox="0 0 400 588">
<style>
text{font:17px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
.bubble{fill:#30363d}
.dot{fill:#8b949e;animation:blink .9s infinite}
.hide{opacity:0}
g{transform-box:fill-box;transform-origin:0 50%}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:none}}
@keyframes typing{0%{opacity:0}15%,85%{opacity:1}100%{opacity:0}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
#t0{animation:typing 1.0s ease 0.60s 1 both}
#m0{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) 1.60s 1 both}
#t1{animation:typing 1.0s ease 2.80s 1 both}
#m1{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) 3.80s 1 both}
#t2{animation:typing 1.0s ease 5.00s 1 both}
#m2{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) 6.00s 1 both}
#t3{animation:typing 1.0s ease 7.20s 1 both}
#m3{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) 8.20s 1 both}
#t4{animation:typing 1.0s ease 9.40s 1 both}
#m4{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) 10.40s 1 both}
#t5{animation:typing 1.0s ease 11.60s 1 both}
#m5{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) 12.60s 1 both}
#t6{animation:typing 1.0s ease 13.80s 1 both}
#m6{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) 14.80s 1 both}
</style>
<rect width="100%" height="100%" rx="12" fill="#0d1117" stroke="#30363d"/>
<g id="t0" class="hide"><rect x="24" y="24" width="64" height="44" rx="22" class="bubble"/><circle cx="43" cy="46" r="3.6" class="dot" style="animation-delay:0.00s"/><circle cx="56" cy="46" r="3.6" class="dot" style="animation-delay:0.15s"/><circle cx="69" cy="46" r="3.6" class="dot" style="animation-delay:0.30s"/></g>
<g id="m0" class="hide"><rect x="24" y="24" width="157" height="48" rx="18" class="bubble"/><text x="40" y="53">Hi, I'm Cristian</text></g>
<g id="t1" class="hide"><rect x="24" y="82" width="64" height="44" rx="22" class="bubble"/><circle cx="43" cy="104" r="3.6" class="dot" style="animation-delay:0.00s"/><circle cx="56" cy="104" r="3.6" class="dot" style="animation-delay:0.15s"/><circle cx="69" cy="104" r="3.6" class="dot" style="animation-delay:0.30s"/></g>
<g id="m1" class="hide"><rect x="24" y="82" width="280" height="72" rx="18" class="bubble"/><text x="40" y="111">Industrial Data &amp; AI Engineer</text><text x="40" y="135">at Renault Group</text></g>
<g id="t2" class="hide"><rect x="24" y="164" width="64" height="44" rx="22" class="bubble"/><circle cx="43" cy="186" r="3.6" class="dot" style="animation-delay:0.00s"/><circle cx="56" cy="186" r="3.6" class="dot" style="animation-delay:0.15s"/><circle cx="69" cy="186" r="3.6" class="dot" style="animation-delay:0.30s"/></g>
<g id="m2" class="hide"><rect x="24" y="164" width="324" height="96" rx="18" class="bubble"/><text x="40" y="193">I work with sensor data from</text><text x="40" y="217">production robots, catching issues</text><text x="40" y="241">before they reach the line</text></g>
<g id="t3" class="hide"><rect x="24" y="270" width="64" height="44" rx="22" class="bubble"/><circle cx="43" cy="292" r="3.6" class="dot" style="animation-delay:0.00s"/><circle cx="56" cy="292" r="3.6" class="dot" style="animation-delay:0.15s"/><circle cx="69" cy="292" r="3.6" class="dot" style="animation-delay:0.30s"/></g>
<g id="m3" class="hide"><rect x="24" y="270" width="332" height="72" rx="18" class="bubble"/><text x="40" y="299">Python · C/C++ · Machine Learning</text><text x="40" y="323">LLM fine-tuning</text></g>
<g id="t4" class="hide"><rect x="24" y="352" width="64" height="44" rx="22" class="bubble"/><circle cx="43" cy="374" r="3.6" class="dot" style="animation-delay:0.00s"/><circle cx="56" cy="374" r="3.6" class="dot" style="animation-delay:0.15s"/><circle cx="69" cy="374" r="3.6" class="dot" style="animation-delay:0.30s"/></g>
<g id="m4" class="hide"><rect x="24" y="352" width="294" height="72" rx="18" class="bubble"/><text x="40" y="381">Building AI agents and</text><text x="40" y="405">automations with Claude Code</text></g>
<g id="t5" class="hide"><rect x="24" y="434" width="64" height="44" rx="22" class="bubble"/><circle cx="43" cy="456" r="3.6" class="dot" style="animation-delay:0.00s"/><circle cx="56" cy="456" r="3.6" class="dot" style="animation-delay:0.15s"/><circle cx="69" cy="456" r="3.6" class="dot" style="animation-delay:0.30s"/></g>
<g id="m5" class="hide"><rect x="24" y="434" width="288" height="72" rx="18" class="bubble"/><text x="40" y="463">Open to collaborating on</text><text x="40" y="487">industrial AI and data projects</text></g>
<g id="t6" class="hide"><rect x="24" y="516" width="64" height="44" rx="22" class="bubble"/><circle cx="43" cy="538" r="3.6" class="dot" style="animation-delay:0.00s"/><circle cx="56" cy="538" r="3.6" class="dot" style="animation-delay:0.15s"/><circle cx="69" cy="538" r="3.6" class="dot" style="animation-delay:0.30s"/></g>
<g id="m6" class="hide"><rect x="24" y="516" width="248" height="48" rx="18" class="bubble"/><text x="40" y="545">Let's connect on LinkedIn</text></g>
</svg>
